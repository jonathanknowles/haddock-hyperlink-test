name: Build
on:
  workflow_dispatch:
  pull_request:
    types:
      - synchronize
      - opened
      - reopened
  push:
    branches:
      - main

# Runs each step with `bash -eo pipefail`, so that a step fails if any command
# in a pipeline fails (such as `check-links.sh` in `check-links.sh | tee`).
defaults:
  run:
    shell: bash

jobs:

  # Builds the documentation with each major version of GHC, and shows where
  # each reference in the documentation of module "Demo" links to.
  build:
    name: ghc-${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      # Every version should be built, even if another version fails.
      fail-fast: false
      matrix:
        cabal:
          - '3.16'
        ghc:
          - '8.0'
          - '8.2'
          - '8.4'
          - '8.6'
          - '8.8'
          - '8.10'
          - '9.0'
          - '9.2'
          - '9.4'
          - '9.6'
          - '9.8'
          - '9.10'
          - '9.12'
          - '9.14'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Environment
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}

      - name: Documentation (Generation)
        run: |
          ./check-links.sh | tee check-links.txt
          {
            echo '```'
            cat check-links.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Copies the documentation into a directory named after the major
      # version of GHC, together with the output of `check-links.sh`.
      - name: Documentation (Staging)
        env:
          dir: site/ghc-${{ matrix.ghc }}
        run: |
          html=$(find dist-newstyle -name Demo.html)
          mkdir -p "$dir"
          cp -R "$(dirname "$html")"/. "$dir"
          cp check-links.txt "$dir"

      - name: Documentation (Upload)
        uses: actions/upload-artifact@v4
        with:
          name: ghc-${{ matrix.ghc }}
          path: site

  # Builds the documentation with Haddock built from source, at each of the
  # given commits of https://github.com/haskell/haddock, using the same version
  # of GHC for every commit, and shows where each reference in the
  # documentation of module "Demo" links to.
  haddock:
    name: haddock-${{ matrix.haddock.name }}
    runs-on: ubuntu-latest
    strategy:
      # Every commit should be built, even if another commit fails.
      fail-fast: false
      matrix:
        cabal:
          - '3.16'
        ghc:
          - '9.6.7'
        # A sequence of commits, from oldest to newest, in which each commit is
        # the parent of the next.
        haddock:
          - name: 38cb1f9c
            commit: 38cb1f9c9a13e4811b04d0a63a1b19570b59737c
          - name: 825d7b91
            commit: 825d7b91eaafc032beae707908067e97bc0b36d7
          - name: 71f868e9
            commit: 71f868e93c381e8ca18b6dd0f7fe85bef28ab7d4
          - name: 2dd45d4b
            commit: 2dd45d4bbaf1e97555150d46e7d8a0bf92aa5364
          - name: 8b6ec7dc
            commit: 8b6ec7dc15866ce52dc35aa986fd41e5097e5abb
          - name: 1a1dddac
            commit: 1a1dddac221f84b205a7fd7ea39d641a3dbeb94f
          - name: 67747ea6
            commit: 67747ea666c0385070b80516bd7d9849d727cd9e
          - name: de814638
            commit: de8146389623023f233d78c02abf71f60ba8c05d
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout (Haddock)
        uses: actions/checkout@v6
        with:
          repository: haskell/haddock
          ref: ${{ matrix.haddock.commit }}
          path: haddock-src

      - name: Environment
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}

      # Removes the Haddock interface files (`.haddock`) installed with GHC,
      # which the Haddock bundled with GHC wrote.
      #
      # Commit 8b6ec7dc changed the format of these files without changing
      # its version number, so a Haddock built from that commit cannot read
      # them. Removing them for every commit treats every commit in the same
      # way.
      #
      # This only removes links to entities in other packages, such as `Int`.
      # No reference in the documentation of module "Demo" refers to such an
      # entity.
      - name: Environment (Interfaces)
        run: ghc-pkg field '*' haddock-interfaces --simple-output | xargs -r rm -fv

      # Builds Haddock without optimisation, which is much faster.
      # When run from its build directory, Haddock needs to be told where to
      # find its resources (such as style sheets) with `haddock_api_datadir`.
      #
      # Some commits pin a different state of the Hackage index, and some pin
      # none at all, so every commit is built with the same state, to make the
      # builds reproducible.
      - name: Haddock (Build)
        working-directory: haddock-src
        env:
          INDEX_STATE: 2023-05-22T15:14:29Z
        run: |
          options=(-w ghc --index-state="$INDEX_STATE")
          cabal build exe:haddock "${options[@]}" --ghc-options=-O0
          echo "HADDOCK=$(cabal list-bin exe:haddock "${options[@]}")" >> "$GITHUB_ENV"
          echo "haddock_api_datadir=$PWD/haddock-api/resources" >> "$GITHUB_ENV"

      # Starts the output with the hash, date, and title of the commit of
      # Haddock. The date is the commit date (not the author date) in UTC, in
      # a format that sorts correctly as a string.
      - name: Documentation (Generation)
        env:
          TZ: UTC
        run: |
          {
            git -C haddock-src log -1 \
              --date=format-local:%Y-%m-%dT%H:%M:%SZ \
              --format='Commit hash:  %H%nCommit date:  %cd%nCommit title: %s'
            ./check-links.sh
          } | tee check-links.txt
          {
            echo '```'
            cat check-links.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Copies the documentation into a directory named after the commit of
      # Haddock, together with the output of `check-links.sh`.
      - name: Documentation (Staging)
        env:
          dir: site/haddock-${{ matrix.haddock.name }}
        run: |
          html=$(find dist-newstyle -name Demo.html)
          mkdir -p "$dir"
          cp -R "$(dirname "$html")"/. "$dir"
          cp check-links.txt "$dir"

      - name: Documentation (Upload)
        uses: actions/upload-artifact@v4
        with:
          name: haddock-${{ matrix.haddock.name }}
          path: site

  # Builds the documentation with the Haddock bundled with prereleases of GHC,
  # and shows where each reference in the documentation of module "Demo"
  # links to:
  #
  # - the latest prerelease of each active release series of GHC, from the
  #   `prereleases` channel of ghcup;
  # - the latest nightly build of GHC, from the `nightlies` channel of ghcup.
  #
  # These are moving targets: the nightly build changes every day, and each
  # prerelease version below needs updating when a newer one is published.
  prerelease:
    name: prerelease-${{ matrix.ghc.name }}
    runs-on: ubuntu-latest
    strategy:
      # Every prerelease should be built, even if another prerelease fails.
      fail-fast: false
      matrix:
        cabal:
          - '3.16'
        ghc:
          - name: '9.12'
            version: '9.12.4.20260713'
          - name: '9.14'
            version: '9.14.1.20260916'
          - name: '10.0'
            version: '10.0.0.20260917'
          - name: 'nightly'
            version: 'latest-nightly'
            channel: 'https://ghc.gitlab.haskell.org/ghcup-metadata/ghcup-nightlies-0.0.7.yaml'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The `prereleases` channel of ghcup is always available. The
      # `nightlies` channel is added only for the nightly build.
      - name: Environment
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc.version }}
          cabal-version: ${{ matrix.cabal }}
          ghcup-release-channel: ${{ matrix.ghc.channel }}

      # Starts the output with the date and time of this run, since the
      # result for a moving target can change from one run to the next.
      - name: Documentation (Generation)
        env:
          TZ: UTC
        run: |
          {
            echo "Run date:     $(date +%Y-%m-%dT%H:%M:%SZ)"
            ./check-links.sh
          } | tee check-links.txt
          {
            echo '```'
            cat check-links.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Copies the documentation into a directory named after the release
      # series (or `nightly`), together with the output of `check-links.sh`.
      - name: Documentation (Staging)
        env:
          dir: site/prerelease-${{ matrix.ghc.name }}
        run: |
          html=$(find dist-newstyle -name Demo.html)
          mkdir -p "$dir"
          cp -R "$(dirname "$html")"/. "$dir"
          cp check-links.txt "$dir"

      - name: Documentation (Upload)
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-${{ matrix.ghc.name }}
          path: site

  # Publishes the documentation for every version and prerelease of GHC, and
  # every commit of Haddock, to GitHub Pages, at:
  #
  # - https://<owner>.github.io/<repository>/ghc-<version>/
  # - https://<owner>.github.io/<repository>/prerelease-<series>/
  # - https://<owner>.github.io/<repository>/haddock-<commit>/
  #
  # This also publishes the documentation of any that did build, if another
  # failed to build.
  deploy:
    name: Deploy
    needs:
      - build
      - prerelease
      - haddock
    if: |
      !cancelled()
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The deployment action needs a Git repository to work in.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: site
          merge-multiple: true

      # Creates a top-level page that links to the documentation built with
      # each version and prerelease of GHC, and each commit of Haddock, and
      # shows the output of `check-links.sh`, in three sections:
      #
      # - versions of GHC, from oldest to newest;
      # - prereleases of GHC, from oldest to newest series, then the nightly;
      # - commits of Haddock, from oldest to newest by commit date, each with a
      #   link to that commit on GitHub.
      - name: Index
        run: |
          shopt -s nullglob

          # Escapes text for inclusion in HTML.
          escape() {
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }

          # Shows the results in the given directory, with a link to the
          # documentation, and with any commit hash linked to its commit.
          # Shows nothing if there are no results in the given directory.
          entry() {
            [ -f "$1/check-links.txt" ] || return 0
            name=${1#site/}
            echo "<h3><a href=\"$name/Demo.html\">$name</a></h3>"
            echo '<pre>'
            escape < "$1/check-links.txt" | sed -E \
              's|^(Commit hash: +)([0-9a-f]{40})$|\1<a href="https://github.com/haskell/haddock/commit/\2">\2</a>|'
            echo '</pre>'
          }

          {
            echo '<!DOCTYPE html>'
            echo '<html><head><meta charset="utf-8">'
            echo '<title>Haddock links by GHC version, GHC prerelease, and Haddock commit</title></head><body>'
            echo '<h1>Haddock links by GHC version, GHC prerelease, and Haddock commit</h1>'

            echo '<h2>Generated documentation by GHC version</h2>'
            printf '%s\n' site/ghc-* | sort -V | while read -r dir; do
              entry "$dir"
            done

            echo '<h2>Generated documentation by GHC prerelease</h2>'
            printf '%s\n' site/prerelease-* | sort -V | while read -r dir; do
              entry "$dir"
            done

            echo '<h2>Generated documentation by Haddock commit</h2>'
            for dir in site/haddock-*; do
              date=$(sed -n 's/^Commit date: *//p' "$dir/check-links.txt")
              printf '%s %s\n' "$date" "$dir"
            done | sort | cut -d ' ' -f 2 | while read -r dir; do
              entry "$dir"
            done

            echo '</body></html>'
          } > site/index.html
          touch site/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
