name: Build
on:
  workflow_dispatch:
  pull_request:
    types:
      - synchronize
      - opened
      - reopened
  push:
    branches:
      - main
jobs:

  # Builds the documentation with each major version of GHC, and shows where
  # each reference in the documentation of module "Demo" links to.
  build:
    name: ghc-${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      # Every version should be built, even if another version fails.
      fail-fast: false
      matrix:
        cabal:
          - '3.16'
        ghc:
          - '8.0'
          - '8.2'
          - '8.4'
          - '8.6'
          - '8.8'
          - '8.10'
          - '9.0'
          - '9.2'
          - '9.4'
          - '9.6'
          - '9.8'
          - '9.10'
          - '9.12'
          - '9.14'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Environment
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}

      - name: Documentation (Generation)
        run: |
          ./check-links.sh | tee check-links.txt
          {
            echo '```'
            cat check-links.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Copies the documentation into a directory named after the major
      # version of GHC, together with the output of `check-links.sh`.
      - name: Documentation (Staging)
        env:
          dir: site/ghc-${{ matrix.ghc }}
        run: |
          html=$(find dist-newstyle -name Demo.html)
          mkdir -p "$dir"
          cp -R "$(dirname "$html")"/. "$dir"
          cp check-links.txt "$dir"

      - name: Documentation (Upload)
        uses: actions/upload-artifact@v4
        with:
          name: ghc-${{ matrix.ghc }}
          path: site

  # Builds the documentation with Haddock built from source, at each of the
  # given commits of https://github.com/haskell/haddock, using the same version
  # of GHC for every commit, and shows where each reference in the
  # documentation of module "Demo" links to.
  haddock:
    name: haddock-${{ matrix.haddock.name }}
    runs-on: ubuntu-latest
    strategy:
      # Every commit should be built, even if another commit fails.
      fail-fast: false
      matrix:
        cabal:
          - '3.16'
        ghc:
          - '9.6.7'
        haddock:
          - name: 2dd45d4b
            commit: 2dd45d4bbaf1e97555150d46e7d8a0bf92aa5364
          - name: 8b6ec7dc
            commit: 8b6ec7dc15866ce52dc35aa986fd41e5097e5abb
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout (Haddock)
        uses: actions/checkout@v6
        with:
          repository: haskell/haddock
          ref: ${{ matrix.haddock.commit }}
          path: haddock-src

      - name: Environment
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}

      # Builds Haddock without optimisation, which is much faster.
      # When run from its build directory, Haddock needs to be told where to
      # find its resources (such as style sheets) with `haddock_api_datadir`.
      - name: Haddock (Build)
        working-directory: haddock-src
        run: |
          cabal build exe:haddock -w ghc --ghc-options=-O0
          echo "HADDOCK=$(cabal list-bin exe:haddock -w ghc)" >> "$GITHUB_ENV"
          echo "haddock_api_datadir=$PWD/haddock-api/resources" >> "$GITHUB_ENV"

      - name: Documentation (Generation)
        env:
          commit: ${{ matrix.haddock.commit }}
        run: |
          {
            echo "Haddock built from haskell/haddock@$commit"
            ./check-links.sh
          } | tee check-links.txt
          {
            echo '```'
            cat check-links.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Copies the documentation into a directory named after the commit of
      # Haddock, together with the output of `check-links.sh`.
      - name: Documentation (Staging)
        env:
          dir: site/haddock-${{ matrix.haddock.name }}
        run: |
          html=$(find dist-newstyle -name Demo.html)
          mkdir -p "$dir"
          cp -R "$(dirname "$html")"/. "$dir"
          cp check-links.txt "$dir"

      - name: Documentation (Upload)
        uses: actions/upload-artifact@v4
        with:
          name: haddock-${{ matrix.haddock.name }}
          path: site

  # Publishes the documentation for every version of GHC and every commit of
  # Haddock to GitHub Pages, at:
  #
  # - https://<owner>.github.io/<repository>/ghc-<version>/
  # - https://<owner>.github.io/<repository>/haddock-<commit>/
  #
  # This also publishes the documentation of any that did build, if another
  # failed to build.
  deploy:
    name: Deploy
    needs:
      - build
      - haddock
    if: |
      !cancelled()
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The deployment action needs a Git repository to work in.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: site
          merge-multiple: true

      # Creates a top-level page that links to the documentation built with
      # each version of GHC and each commit of Haddock, and shows the output
      # of `check-links.sh`.
      - name: Index
        run: |
          {
            echo '<!DOCTYPE html>'
            echo '<html><head><meta charset="utf-8">'
            echo '<title>Haddock links by GHC version and Haddock commit</title></head><body>'
            echo '<h1>Haddock links by GHC version and Haddock commit</h1>'
            {
              printf '%s\n' site/ghc-* | sort -V
              printf '%s\n' site/haddock-*
            } | while read -r dir; do
              version=${dir#site/}
              echo "<h2><a href=\"$version/Demo.html\">$version</a></h2>"
              echo '<pre>'
              cat "$dir/check-links.txt"
              echo '</pre>'
            done
            echo '</body></html>'
          } > site/index.html
          touch site/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
